        targetType: llm
      id: kb-source-llm-target
      source: kb
      sourceHandle: source
      target: llm
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: llm
        targetType: code
      id: llm-source-parse_llm-target
      source: llm
      sourceHandle: source
      target: parse_llm
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: code
        targetType: http-request
      id: parse_llm-source-remember-target
      source: parse_llm
      sourceHandle: source
      target: remember
      targetHandle: target
      type: custom
      zIndex: 0
